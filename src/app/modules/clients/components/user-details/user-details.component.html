<div class="pt-5 pl-3">
    <mat-icon class="cursor-pointer" (click)="onPreviousPage()">arrow_back</mat-icon>
    <div class="text-end mb-3">
        <button class="btn btn-primary" *ngIf="!newInvoice" (click)="newInvoice = !newInvoice">
            Add New Invoice
        </button>
    </div>
    <div class="row">
        <div class="col-lg-4 mt-2 col-md-6 col-sm-12 cursor-pointer" (click)="onClickCardBox('customers')">
            <div class="card card-1 border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs card-text-color text-uppercase mb-1">
                                Invoices
                            </div>
                            <div class="h5 mb-0 font-weight-bold text-gray-800">{{inVoicesList?.length}}</div>
                        </div>
                        <div class="col-auto">
                            <i class="fa-solid fa-file-invoice fa-2x text-gray-300"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4 mt-2 col-md-6 col-sm-12 cursor-pointer" (click)="onClickCardBox('invoices')">
            <div class="card card-5 border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs card-text-color text-uppercase mb-1">
                                Services
                            </div>
                            <div class="h5 mb-0 font-weight-bold text-gray-800">{{servicesList?.length}}</div>
                        </div>
                        <div class="col-auto">
                            <i class="fas fa-bag-shopping fa-2x text-gray-300"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4 mt-2 col-md-6 col-sm-12 cursor-pointer" (click)="onClickCardBox('services')">
            <div class="card card-2 border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs card-text-color text-uppercase mb-1">
                                Total Amount
                            </div>
                            <div class="h5 mb-0 font-weight-bold text-gray-800">Rs.{{totalRevenue}}</div>
                        </div>
                        <div class="col-auto">
                            <i class="fa-solid fa-indian-rupee-sign fa-2x text-gray-300"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row m-3 mb-6" *ngIf="clientInfo">
    <div class="col-lg-4 col-sm-12">
        <p-card [header]="clientInfo['name']" [subheader]="getDate(clientInfo['createdAt'])">
            <ng-template pTemplate="header" >
                <img alt="Card" class="img-size" src="../../../../../assets/clients/png/client.png" />
            </ng-template>
            <div class="row" *ngFor="let key of clientInfoKeys">
                <div class="col-lg-6 col-sm-12">
                    <div class="key">
                        <ng-container
                            *ngIf="key.field_key != 'createdAt' && key.field_key != 'updatedAt' && key.field_key != 'name' && key.field_key != '__v'">
                            <label>{{key.field_name | uppercase}}</label>
                        </ng-container>
                    </div>
                </div>
                <div class="col-lg-6 col-sm-12" *ngIf="!isArrayCheck(clientInfo[key.field_key])">
                    <div class="value">
                        <ng-container
                            *ngIf="key.field_key != 'createdAt' && key.field_key != 'updatedAt' && key.field_key != 'name' && key.field_key != '__v'">
                            <h3>{{clientInfo[key.field_key]}}</h3>
                        </ng-container>
                    </div>
                </div>
                <div class="col-lg-12 col-sm-12" *ngIf="isArrayCheck(clientInfo[key.field_key])">
                    <div class="value">
                        <ng-container
                            *ngIf="key.field_key != 'createdAt' && key.field_key != 'updatedAt' && key.field_key != 'name' && key.field_key != '__v'">
                            <div style="text-align: start;">
                                <div class="row ml-3">
                                    <ng-container *ngFor="let obj of clientInfo[key.field_key]">
                                        <div class="col p-0">
                                          <div class="col-4" *ngIf="obj.fieldValue">
                                            <ng-container>
                                              <h4 class="m-0">{{ obj.fieldName | uppercase }}</h4>
                                            </ng-container>
                                          </div>
                                          <div class="col-4" *ngIf="obj.fieldValue == undefined">
                                            <ng-container>
                                              <h4 class="m-0">{{ obj}}</h4>
                                            </ng-container>
                                          </div>
                                        </div>
                                      </ng-container>
                                </div>
                            </div>
                        </ng-container>
                    </div>
                </div>
            </div>
            <ng-template pTemplate="footer">
                <!-- <p-button label="Save" icon="pi pi-check"></p-button>
                <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-secondary" [style]="{ 'margin-left': '.5em' }"></p-button> -->
            </ng-template>
        </p-card>
    </div>
    <div class="col-lg-8 col-sm-12 mt-5 mb-5">
        <div>
            <div *ngIf="newInvoice">
                <div class="row mt-4">
                    <div class="col-sm-12 col-lg-12"
                        *ngFor="let option of userDetails?.app_meta_details?.servicesList;let j = index">
                        <label>
                            <input class="form-check-input" type="checkbox"
                                (change)="onServiceOptionChange($event, option)">
                            {{ option.service_name }} - <span
                                style="color: blueviolet;">Rs.{{option.service_price}}</span>
                        </label>
                    </div>
                </div>
                <div class="col-lg-12 col-sm-12 mb-5">
                    <button class="btn btn-success mt-5 mr-3" (click)="onAddNewInvoice()">Save</button>
                    <button class="btn btn-warning mt-5" (click)="newInvoice = !newInvoice">Cancel</button>
                </div>
                <hr>
            </div>
        </div>
        <div>
            <h1 class="text-decoration-underline text-center">List Of Previous Services</h1>
            <!-- <p-timeline [value]="inVoicesList">
                <ng-template pTemplate="content" let-event>
                    <small class="p-text-secondary">{{ event.createdAt | date : 'medium' }}</small>
                </ng-template>
                <ng-template pTemplate="opposite" let-event>
                    Bill No - {{ event.billNo }} <br>
                    Amount - {{ event.finalTotal }}
                </ng-template>
            </p-timeline> -->
            <p-timeline [value]="inVoicesList" align="alternate" styleClass="customized-timeline">
                <ng-template pTemplate="content" let-event>
                    <span class="custom-marker shadow-2" [style.backgroundColor]="event.color">
                        <i ngClass="pi pi-check"></i>
                    </span>
                </ng-template>
                <ng-template pTemplate="content" let-event>
                    <p-card [header]="'Bill No - '+ event.billNo" [subheader]="event.createdAt">
                        <h3 style="font-weight: 500;">
                            Bill Amount - Rs.{{ event.finalTotal }}
                        </h3>
                        <mat-chip-set class="example-chip"  cdkDropListOrientation="horizontal"
                            >
                            <mat-chip class="example-box" *ngFor="let service of event.products">
                                {{service.name}} - <label>{{service.price}}</label>
                            </mat-chip>
                        </mat-chip-set>
                        <!-- <button pButton label="Read more" class="p-button-text"></button> -->
                    </p-card>
                </ng-template>
            </p-timeline>
        </div>
    </div>
</div>
