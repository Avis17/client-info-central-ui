<div class="pt-5 pl-3">
    <mat-icon class="cursor-pointer" (click)="onPreviousPage()">arrow_back</mat-icon>
</div>
<div class="m-7" *ngIf="clientInfo">
    <div class="text-end">
        <label>Customer Joined On:</label>
        <h3>{{clientInfo['createdAt'] | date:'shortDate'}}</h3>
    </div>
    <div class="row">
        <div class="col-lg-4 col-md-4 col-sm-12 mt-3" *ngFor="let key of clientInfoKeys">
            <ng-container *ngIf="key.field_key != 'createdAt' && key.field_key != 'updatedAt' && key.field_key != '__v'">
                <label>{{key.field_name | uppercase}}</label>
                <h3 *ngIf="!isArrayCheck(clientInfo[key.field_key])">{{clientInfo[key.field_key]}}</h3>
                <ol *ngIf="isArrayCheck(clientInfo[key.field_key])">
                    <ng-container *ngFor="let obj of clientInfo[key.field_key]">
                        <li *ngIf="obj.fieldValue">{{obj.fieldName}}</li>
                    </ng-container>
                </ol>
            </ng-container>
        </div>
    </div>
</div>
