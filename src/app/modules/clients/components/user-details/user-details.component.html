<div class="row m-3" *ngIf="clientInfo">
    <div class="col-lg-7 col-sm-12">
        <p-card [header]="clientInfo['name']" [subheader]="clientInfo['createdAt']">
            <ng-template pTemplate="header">
                <img alt="Card" class="img-size" src="../../../../../assets/clients/png/client.png" />
            </ng-template>
            <div class="row" *ngFor="let key of clientInfoKeys">
                <div class="col-lg-6 col-sm-12">
                    <div class="key text-center">
                        <ng-container
                            *ngIf="key.field_key != 'createdAt' && key.field_key != 'updatedAt' && key.field_key != '__v'">
                            <label>{{key.field_name | uppercase}}</label>
                        </ng-container>
                    </div>
                </div>
                <div class="col-lg-6 col-sm-12">
                    <div class="value text-center">
                        <ng-container
                            *ngIf="key.field_key != 'createdAt' && key.field_key != 'updatedAt' && key.field_key != '__v'">
                            <h3 *ngIf="!isArrayCheck(clientInfo[key.field_key])">{{clientInfo[key.field_key]}}</h3>
                            <div *ngIf="isArrayCheck(clientInfo[key.field_key])" style="text-align: start;">
                                <ng-container *ngFor="let obj of clientInfo[key.field_key]">
                                    <li *ngIf="obj.fieldValue">{{obj.fieldName}}</li>
                                </ng-container>
                            </div>
                        </ng-container>
                    </div>
                </div>
            </div>
            <ng-template pTemplate="footer">
                <!-- <p-button label="Save" icon="pi pi-check"></p-button>
                <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-secondary" [style]="{ 'margin-left': '.5em' }"></p-button> -->
            </ng-template>
        </p-card>
    </div>
    <div class="col-lg-4 col-sm-12 mt-5 mb-5">
        <div>
            <div class="text-end mb-3">
                <button class="btn btn-primary" *ngIf="!newInvoice" (click)="newInvoice = !newInvoice">
                    Add New Invoice
                </button>
            </div>
            <div *ngIf="newInvoice" >
                <div class="row mt-4">
                    <div class="col-sm-12 col-lg-12" *ngFor="let option of userDetails?.app_meta_details?.servicesList;let j = index">
                        <label>
                            <input class="form-check-input" type="checkbox" (change)="onServiceOptionChange($event, option)">
                            {{ option.service_name }} - <span style="color: blueviolet;">Rs.{{option.service_price}}</span>
                        </label>
                    </div>
                </div>
                <div class="col-lg-12 col-sm-12 mb-5">
                    <button class="btn btn-success mt-5 mr-3" (click)="onAddNewInvoice()">Save</button>
                    <button class="btn btn-warning mt-5" (click)="newInvoice = !newInvoice">Cancel</button>
                </div>
                <hr>
            </div>
        </div>
        <div>
            <h1>List Of Services Done</h1>
            <p-timeline [value]="inVoicesList">
                <ng-template pTemplate="content" let-event>
                    <small class="p-text-secondary">{{ event.createdAt | date : 'medium' }}</small>
                </ng-template>
                <ng-template pTemplate="opposite" let-event>
                    Bill No - {{ event.billNo }} <br>
                    Amount - {{ event.finalTotal }}
                </ng-template>
            </p-timeline>
        </div>
    </div>
</div>
