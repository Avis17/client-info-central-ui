<app-custom-loader *ngIf="isLoading"></app-custom-loader>


<nav class="navbar navbar-expand-sm navbar-dark bg-secondary d-flex justify-content-between">
    <a class="navbar-brand" href="#">INVOICE GENERATOR</a>
    <div>
        <button type="submit" class="btn btn-warning ml-3" data-bs-toggle="modal" data-bs-target="#exampleModal">Update
            T&C</button>
    </div>
</nav>
<form #invoiceForm="ngForm">
    <div class="container-fluid pt-2 mb-5" *ngIf="!isBillCreated">
        <div class="row">
            <div class="col-md-12">
                <div class="card border-secondary">
                    <div class="card-body">
                        <h4 class="card-title">Customer Details</h4>
                        <div class="row">
                            <div class="col-lg-6 col-sm-12 mb-3">
                                <label for="email">Bill No</label>
                                <input type="text" class="form-control" name="billNo" id="billNo"
                                    [(ngModel)]="invoice.billNo" required>
                            </div>
                            <div class="col-lg-6 col-sm-12 mb-3">
                                <label for="email">GST No (If any)</label>
                                <input type="text" class="form-control" name="gstNo" id="gstNo"
                                    [(ngModel)]="invoice.gstNo">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="name">Name</label>
                                    <input type="text" class="form-control" name="name" id="name"
                                        [(ngModel)]="invoice.customerName" #CustName="ngModel" required>
                                </div>
                                <div class="form-group mb-3">
                                    <label for="address">Address</label>
                                    <textarea class="form-control" name="address" id="address" row="3"
                                        [(ngModel)]="invoice.address" #Address="ngModel" required></textarea>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="email">Email ID</label>
                                    <input type="email" class="form-control" name="email" id="email"
                                        [(ngModel)]="invoice.email" required>
                                </div>
                                <div class="form-group mb-3">
                                    <label for="phone">Contact No.</label>
                                    <input type="number" class="form-control no-arrow" name="phone" id="phone"
                                        [(ngModel)]="invoice.phone" #phone="ngModel" required>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card border-secondary mt-2">
                    <div class="card-body">
                        <h4 class="card-title d-flex justify-content-between">Order Details <button type="button"
                                class="btn btn-info" (click)="addProduct()">+</button></h4>
                        <div class="row table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th width="25%">Product</th>
                                        <th width="25%">Price</th>
                                        <th width="25%">Quantity</th>
                                        <th width="25%">Amount</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let product of invoice.products; let i=index">
                                        <td scope="row">
                                            <select class="form-control" name="productName{{i}}" 
                                            [ngClass]="{'is-invalid': invoiceForm.submitted && ProductName.invalid}"
                                                id="productName" [(ngModel)]="product.name" #ProductName="ngModel"
                                                (change)="onProductChange($event, i)"
                                                required>
                                                <option *ngFor="let service of servicesList" [value]="service.itemName">{{service.itemName}}</option>
                                            </select>                                   
                                        </td>
                                        <td>
                                            <input type="number" class="form-control" name="price{{i}}" id="price"
                                                [ngClass]="{'is-invalid': invoiceForm.submitted && ProductPrice.invalid}"
                                                [(ngModel)]="product.price" #ProductPrice="ngModel" required>
                                        </td>
                                        <td>
                                            <input type="number" class="form-control" name="quantity{{i}}" id="quantity"
                                                [ngClass]="{'is-invalid': invoiceForm.submitted && ProductQty.invalid}"
                                                [(ngModel)]="product.qty" #ProductQty="ngModel" required>
                                        </td>
                                        <td>
                                            {{product.price * product.qty || ''}}
                                        </td>
                                        <td>
                                            <button class="btn-close" (click)="onProductRemove(i)"></button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card border-secondary mt-2 mb-5" *ngIf="invoice.products.length >= 1">
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <button class="btn btn-info" style="float: right;"
                                    (click)="onCalculateSubTotal()">Calculate SubTotal</button>
                            </div>
                            <div class="col-md-6">
                                <input class="form-control float-right no-arrow" type="number" name="subtotal" *ngIf="invoice.subTotal > 0"
                                    [(ngModel)]="invoice.subTotal">
                                    <div class="mt-2">
                                        <span>Credit Amount Earned</span> - <span>{{invoice.creditAmountEarned}}</span>
                                    </div>
                                    <div class="form-check mt-2">
                                        <input type="checkbox" class="form-check-input" (change)="onCreditUseChange($event)" id="creditPointsUse">
                                        <label class="form-check-label" for="creditPointsUse">Use My Credit Points Amount</label>
                                    </div>
                            </div>

                        </div>

                        <div class="row mb-3" *ngIf="invoice.subTotal > 0">
                            <div class="col-md-6 text-end">
                                <span class="float-right mt-2">Tax GST</span>
                            </div>
                            <div class="col-md-3">
                                <select class="form-select" name="gstname" [(ngModel)]="invoice.cgst">
                                    <option *ngFor="let gst of gstList" [value]="gst">{{gst}} %</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input class="form-control" [attr.disabled]="true" name="cgst"
                                    [value]="(invoice.subTotal * invoice.cgst)/100">
                            </div>
                        </div>
                        <!-- <div class="row mb-3" *ngIf="invoice.subTotal > 0">
                            <div class="col-md-6">
                                <span class="float-right mt-2">Tax SGST</span>
                            </div>
                            <div class="col-md-3">
                                <select class="form-select" name="name" [(ngModel)]="invoice.sgst" >
                                    <option *ngFor="let gst of gstList" [value]="gst" >{{gst}} %</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input  class="form-control" [attr.disabled]="true"  name="sgst" [value]="(invoice.subTotal * invoice.sgst)/100">
                            </div>
                        </div>
        
                        <div class="row mb-3" *ngIf="invoice.subTotal > 0">
                            <div class="col-md-6">
                                <span class="float-right mt-2">Tax IGST</span>
                            </div>
                            <div class="col-md-3">
                                <select class="form-select" name="name" [(ngModel)]="invoice.igst" >
                                    <option *ngFor="let gst of gstList" [value]="gst" >{{gst}} %</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input  class="form-control" [attr.disabled]="true"  name="igst"  [value]="(invoice.subTotal * invoice.igst)/100">
                            </div>
                        </div> -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <button class="btn btn-primary" style="float: right;" (click)="onCalculateTotal()"
                                    *ngIf="isSubTotalClicked && invoice.subTotal > 0">Calculate Total</button>
                            </div>
                            <div class="col-md-6">
                                <input class="form-control float-right" name="finaltotal"
                                    *ngIf="isSubTotalClicked && invoice.finalTotal>0" [(ngModel)]="invoice.finalTotal">
                            </div>

                        </div>
                    </div>
                </div>
               <div class="mt-5" *ngIf="!checkDatas()">
                <button type="submit" class="btn btn-warning ml-3" (click)="generatePDF()">Generate
                    Invoice</button>
               </div>
            </div>
        </div>
    </div>
    <div class="container-fluid pt-2 mb-5" *ngIf="isBillCreated">
        <div class="row">
            <div class="col">
                <div class="card border-secondary">
                    <div class="card-body">
                        <h4 class="card-title">Payment Status:</h4>
                        <div class="row ml-5">
                            <div class="col">
                                <input type="radio" name="paymentStatus" [(ngModel)]="paymentStatus" class="ml-3" value="full"> Full Payment
                                <input type="radio" name="paymentStatus" [(ngModel)]="paymentStatus" class="ml-3" value="part"> Part Payment
                                <div class="mt-3">
                                    <button *ngIf="paymentStatus == 'full'" class="btn btn-info" (click)="onSavePaymentDetails()">Save</button>
                                </div>
                            </div>
                        </div>
                        <div *ngIf="paymentStatus != '' && paymentStatus == 'part'" class="m-3">
                            <input type="text" (input)="validateAmount()" name="partPaymentAmount" class="form-control" [(ngModel)]="partPaymentAmount" placeholder="Enter Part Payment Amount">
                            <label *ngIf="isInvlidPartAmount" style="color: red;">part amount should not be grater than final total.</label>
                            <div class="mt-3">
                                <button [disabled]="partPaymentAmount == '' || isInvlidPartAmount" class="btn btn-info" (click)="onSavePaymentDetails()">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>

<div class="modal" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Terms & Conditions</h5>
                <!-- <button type="btn btn-primary" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button> -->
            </div>
            <div class="modal-body">
                <div class="card border-secondary mt-2">
                    <div class="card-body">
                        <div class="text-end">
                            <p-button label="New T&C" styleClass="p-button-rounded p-button-info" icon="pi pi-plus" class="mr-2" (click)="onAddTerms()"></p-button>
                        </div>
                        <div class="row m-3" *ngFor="let term of termsList;let i = index">
                            <textarea [name]="'term'+i" [(ngModel)]="term.terms" type="text"
                                class="form-control col-10"></textarea>
                            <div class="text-center col-2">
                                <button class="btn-close" (click)="onRemoveTerms(i)"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" data-bs-dismiss="modal" [disabled]="onValidateTc()" (click)="onSaveTermsList()" class="btn btn-info">Save changes</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="onLoadDefault()">Close</button>
            </div>
        </div>
    </div>
</div>
