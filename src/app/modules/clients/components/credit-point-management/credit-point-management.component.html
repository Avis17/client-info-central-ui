<app-custom-loader *ngIf="isLoading"></app-custom-loader>
<div class="pt-5 pl-3">
  <mat-icon class="cursor-pointer" (click)="onPreviousPage()">arrow_back</mat-icon>
</div>
<div class="m-sm-1 m-lg-5 mt-5 mb-8">
  <div class="row w-100">
    <img width="60%" height="500px" src="../../../../../assets/clients/jpg/credit-points.jpg">
  </div>
 
  <form [formGroup]="creditPointForm" (ngSubmit)="saveChanges()">
    <div class="row">
      <div class="col-lg-6 col-md-12 col-sm-12">
        <div class="mt-3">
          <label for="creditNeeded" class="mb-1">Credit Points Required for Billing?</label>
          <div class="w-100">
            <p-dropdown placeholder="Credit Points (Option)" [options]="creditOptions" optionLabel="name" formControlName="isCreditPointOptionRequired" [style]="{'minWidth':'100%'}"></p-dropdown>
          </div>
          <div
            *ngIf="creditPointForm.get('isCreditPointOptionRequired')?.invalid && creditPointForm.get('isCreditPointOptionRequired')?.touched"
            class="text-danger">
            Credit Points option is required.
          </div>
        </div>
      </div>
      <div class="col-lg-6 col-md-12 col-sm-12">
        <div class="mt-3">
          <label for="creditNeeded"  class="mb-1">Credit Based On:</label>
          <div class="w-100">
            <p-dropdown [disabled]="true" [style]="{'minWidth':'100%'}" [options]="creditBasedOnOptions" optionLabel="name"
              formControlName="creditBasedOn"></p-dropdown>
          </div>
        </div>
      </div>
      <div class="col-lg-6 col-md-12 col-sm-12">
        <div *ngIf="creditPointForm.get('isCreditPointOptionRequired')?.value?.name === 'Required'">
          <div class="form-group mt-3">
            <label for="creditAmount" class="mb-1">
              Credit Point is Added if Purchase Value is Above (in RS)
            </label>
            <input type="number" class="form-control" id="creditAmount" formControlName="purchaseValueAmount">
            <div *ngIf="creditPointForm.get('purchaseValueAmount')?.invalid && creditPointForm.get('purchaseValueAmount')?.touched"
              class="text-danger">
              Purchase value is required.
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-6 col-md-12 col-sm-12">
        <div *ngIf="creditPointForm.get('isCreditPointOptionRequired')?.value?.name === 'Required'">  
          <div class="form-group mt-3">
            <label for="redemptionAmount" class="mb-1">
              1 Credit Point Value is Equal to (in RS).
            </label>
            <input type="number" class="form-control" id="redemptionAmount" formControlName="redemptionAmount">
            <div
              *ngIf="creditPointForm.get('redemptionAmount')?.invalid && creditPointForm.get('redemptionAmount')?.touched"
              class="text-danger">
              Value of 1 Credit Point is required.
            </div>
          </div>
        </div>
      </div>
    </div>
    

   

    <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
  </form>
</div>
