<div class="m-4">
    <div class="row align-end">
          <div class="col-lg-6 col-md-6 col-sm-12">
            <input type="text" class="form-control custom-date" ngxDaterangepickerMd [(ngModel)]="selectedDates" [showCustomRangeLabel]="true"
            [alwaysShowCalendars]="true" (ngModelChange)="ngModelDateChange($event)" [ranges]="ranges" [linkedCalendars]="true" [isInvalidDate]="isInvalidDate"
            [showClearButton]="true" placeholder="Filter by dates..."/>
          </div>
    </div>
    <div class=" row flex-wrap justify-content-center">
        <div class="col-12">
            <div class="row">
                <div class="col-lg-4 mt-2 col-md-6 col-sm-12">
                    <div class="card card-1 border-left-primary shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs card-text-color text-uppercase mb-1">
                                        Customers
                                    </div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">{{entities.length}}</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fas fa-user fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 mt-2 col-md-6 col-sm-12">
                    <div class="card card-2 border-left-primary shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs card-text-color text-uppercase mb-1">
                                        Services
                                    </div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">{{inVoicesList?.length}}</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fas fa-bag-shopping fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 mt-2 col-md-6 col-sm-12">
                    <div class="card card-3 border-left-primary shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs card-text-color text-uppercase mb-1">
                                        Revenue
                                    </div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">{{totalRevenue}}</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fa-solid fa-indian-rupee-sign fa-2x text-gray-300"></i>
                                    <!-- <i class="fas fa-bag-shopping fa-2x text-gray-300"></i> -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-12 col-md-12">
            <div class="row">
                <div class="col-sm-12 col-md-6 col-lg-4" *ngFor="let chart of dynamicChartDetails; let i=index">
                    <div class="card p-5 mb-3" *ngIf="entities.length > 0">
                        <div class="text-end mb-3">
                            <h3 class="chart-text-color">{{chart.chartName | uppercase}}</h3>
                        </div>
                        <p-chart [type]="chart.chartType" height="300" type="pie" [data]="chart.chartData"
                            [options]="chart.chartOptions"></p-chart>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-user-table [tableData]="getStringfiyData(entities)" [queryData]="tableQuery"></app-user-table>
