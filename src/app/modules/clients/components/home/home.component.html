    </div>
    <div class="row flex-wrap justify-content-center">
        <div class="col-md-12 col-lg-6" *ngFor="let chart of dynamicChartDetails; let i=index">
            <div class="card p-5 mb-3" *ngIf="entities.length > 0">
                <div class="text-end mb-3">
                    <h3>{{chart.chartName | uppercase}}</h3>
                </div>
                <p-chart [type]="chart.chartType" height="400" type="pie" [data]="chart.chartData"
                    [options]="chart.chartOptions"></p-chart>
            </div>
        </div>
    </div>

    <p-toolbar class="mt-4">
        <div class="p-toolbar-group-start">
            <input type="text" pInputText placeholder="Search Fields" (input)="applyFilterGlobal($event, 'contains')" />
        </div>
        <div class="p-toolbar-group-end">
            <p-button [label]="userDetails?.app_meta_details?.client_name || 'Add User'" icon="pi pi-plus" class="mr-2"
                (click)="onAddUSer()"></p-button>
        </div>
    </p-toolbar>
</div>
<div class="card m-4" *ngIf="entities.length > 0">
    <p-table #tableref [value]="entities" [paginator]="true" [columns]="cols" [rows]="5" [showCurrentPageReport]="true"
        [tableStyle]="{ 'min-width': '60rem' }"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[5, 10, 25, 50]">

        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of cols" [pSortableColumn]="col.field"
                    style="width:20%;text-align: center !important;">
                    {{ col.header }}
                    <p-sortIcon [field]="col.field"></p-sortIcon>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr>
                <td style="text-align: center;" *ngFor="let col of columns">
                    <ng-container *ngIf="!isArrayCheck(rowData[col.field]) && col.field == 'createdAt'">{{
                        rowData[col.field] | date:'shortDate' }}</ng-container>
                    <ng-container *ngIf="!isArrayCheck(rowData[col.field]) && col.field != 'createdAt'">{{
                        rowData[col.field] }}</ng-container>
                    <ng-container *ngIf="isArrayCheck(rowData[col.field])">{{ rowData[col.field] | arrayDestructure
                        }}</ng-container>

                </td>
            </tr>
        </ng-template>
        <!-- <ng-template pTemplate="paginatorleft">
            <p-button type="button" icon="pi pi-plus" styleClass="p-button-text"></p-button>
        </ng-template> -->
        <!-- <ng-template pTemplate="paginatorright">
            <p-button type="button" icon="pi pi-cloud" styleClass="p-button-text"></p-button>
        </ng-template> -->
    </p-table>
</div>
