<app-custom-loader *ngIf="isLoading"></app-custom-loader>

<div class="pt-5 pl-3">
    <mat-icon class="cursor-pointer" (click)="onPreviousPage()">arrow_back</mat-icon>
</div>
<div class="container mt-5">
    <p-accordion class="mt-1" [multiple]="true" [activeIndex]="[0]">
        <p-accordionTab header="List of Users">
            <div class="row">
                <div class="col-lg-4 col-sm-12 col-md-6 mb-3 mb-md-0">
                    <input type="text"  placeholder="Search user" [(ngModel)]="searchText" class="form-control">
                </div>
            </div>
           <div class="table-responsive">
            <table class="table mb-3">
                <thead>
                    <tr style="text-align: center;">
                        <th>S.No</th>
                        <th>Company Email</th>
                        <th>Customer Email</th>
                        <th>Authorize To</th>
                        <th>Permission</th>
                        <th>Joined Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let app of allAppUsers | search:searchText | paginate: { itemsPerPage: itemsPerPage, currentPage: currentPage };let i=index" style="text-align: center;">
                        <td>{{i+1}}</td>
                        <td>
                            <span >{{app.companyEmail || '--'}}</span>
                        </td>
                        <td>
                            <span >{{app.email || '--'}}</span>
                        </td>
                        <td>
                            <span >{{app.authorizeTo || '--'}}</span>
                        </td>
                        <td>
                            <span>{{app.permission || '--'}}</span>
                        </td>
                        <td>
                            <span>{{app.createdAt | dateformat}}</span>
                        </td>
                        <td>
                            <!-- <p-splitButton label="Edit" icon="pi pi-user-edit" (onClick)="onEdit(app)" (onDropdownClick)="onDropDownClick(app)" styleClass="p-button-outlined-sm mr-2 mb-2" 
                            [model]="items"></p-splitButton> -->
                            <!-- <a appSkipLocationChange [commands]="['/admin/view-meta-details/'+app._id]" class="btn btn-primary mr-2">View Details</a> -->
                                
                            <button class="btn btn-danger" (click)="onDelete(app._id)">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
           </div>
           <div class="mt-3">
            <pagination-controls (pageChange)="currentPage = $event"></pagination-controls>
           </div>
        </p-accordionTab>
    </p-accordion>
</div>

<app-footer></app-footer>
