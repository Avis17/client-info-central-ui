<div class="card-container pt-6 mb-5">
    <div class="text-center">
        <h4 class="fs-24 fw-600">
            <i>
                {{"client info central" | uppercase}}

            </i>    
        </h4>
    </div>
    <div class="row pt-2">
        <div class="col-lg-6 col-md-6 col-sm-12 pt-5">
            <mat-card class="admin-card">
                <mat-card-header class="pb-5">
                    <div class="row">
                        <div class="col-md-12 col-sm-12 col-lg-7 mt-3">
                            <img class="mt-3" width="100%" height="250px" src="../../../../../assets/admin/user.png">
                        </div>
                        <div class="col-md-12 col-sm-12 col-lg-5 text-center mt-3">
                            <h4 class="fs-24 fw-600">New User?</h4>
                        </div>
                    </div>       
                 </mat-card-header>
                <mat-card-content>
                  
                  <mat-divider></mat-divider>
                </mat-card-content>
                <mat-card-actions>
                  <button (click)="onClickNavigation('register-user')" mat-flat-button class="primary-bg mr-3">REGISTER</button>
                  <button (click)="onClickNavigation('view-users')" mat-flat-button class="secondary-bg">VIEW USERS</button>
                </mat-card-actions>
                <mat-card-footer>
                  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
                </mat-card-footer>
              </mat-card>
        </div>
        <div class="col-lg-6 col-md-6 col-sm-12 pt-5 mb-4">
            <mat-card class="admin-card">
                <mat-card-header class="pb-5">
                    <div class="row">
                        <div class="col-md-12 col-sm-12 col-lg-7 mt-3">
                            <img class="mt-3" width="100%" height="250px" src="../../../../../assets/admin/app.png">
                        </div>
                        <div class="col-md-12 col-sm-12 col-lg-5 text-center mt-3">
                            <h4 class="fs-24 fw-600">New Client App?</h4>
                        </div>
                    </div>
                </mat-card-header>
                <mat-card-content>
                  <mat-divider></mat-divider>
                </mat-card-content>
                <mat-card-actions>
                  <button (click)="onClickNavigation('create-app-meta')" mat-flat-button class="primary-bg mr-3">CREATE</button> &nbsp;
                  <button (click)="onClickNavigation('view-app-metas')" mat-flat-button class="secondary-bg">VIEW METAS</button>
                </mat-card-actions>
                <mat-card-footer>
                  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
                </mat-card-footer>
              </mat-card>
        </div>
    </div>
</div>

<app-footer></app-footer>
