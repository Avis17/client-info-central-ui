
<div class="card-container mt-8">

    <div class="card card-width-40">
        <div class="card-header">
          Client Info Central
        </div>
        <div class="card-body">
            <div class="mt-3">
                <input class="form-control" type="text" placeholder="Email" [(ngModel)]="email">
            </div>
            <div class="mt-3">
                <input class="form-control" type="password" placeholder="Password" [(ngModel)]="password">
            </div>
            <div class="mt-3">
                <button (click)="onLoginBtnClick()" mat-flat-button class="primary-bg">{{'Login' | uppercase}}</button>
            </div>
        </div>
    </div>

    
</div>
